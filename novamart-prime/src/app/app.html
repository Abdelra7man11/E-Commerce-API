<div class="app-layout d-flex flex-column min-vh-100 position-relative">
  <!-- Full-Screen Centered Glassmorphism Loader -->
  @if (busyService.busyRequestCount() > 0) {
    <div class="global-center-loader">
      <div class="loader-content">
        <div class="spinner-ring-wrap">
          <div class="outer-spinner-ring"></div>
          <div class="inner-loader-logo">
            <i class="fa-solid fa-bolt"></i>
          </div>
        </div>
        <h5 class="fw-bold mb-1 text-dark">NovaMart Prime</h5>
        <p class="text-muted small mb-0">Loading fresh selections...</p>
      </div>
    </div>
  }

  <!-- Header Navigation -->
  <app-navbar></app-navbar>

  <!-- Main View Area -->
  <main class="flex-grow-1">
    <router-outlet></router-outlet>
  </main>

  <!-- Slide-out Cart Drawer -->
  <app-cart-drawer></app-cart-drawer>

  <!-- Global Toast Notifications -->
  <app-toast></app-toast>

  <!-- Footer -->
  <app-footer></app-footer>
</div>
